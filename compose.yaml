name: dms-archiv
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      CODEX_SERVICE_URL: http://codex:8001
      STORAGE_ROOT: /data/documents
      CONSUME_ROOT: /data/consume
      STORAGE_SERVICE_URL: http://storage:8002
      STORAGE_SERVICE_TOKEN: ${STORAGE_SERVICE_TOKEN:?Generate STORAGE_SERVICE_TOKEN in .env first}
      SCANNER_PUBLIC_HOST: ${SCANNER_PUBLIC_HOST:-}
      SFTP_PORT: ${SFTP_PORT:-2222}
      FTP_PORT: ${FTP_PORT:-2121}
      NAS_MOUNT_PATH: ${NAS_MOUNT_PATH:-/srv/dms-system/nas}
      CONSUME_HOST_PATH: ${CONSUME_PATH:-./consume}
    depends_on:
      storage:
        condition: service_healthy
    networks: [default, codex_private]
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8120}:8000"
    volumes:
      - ${DOCUMENTS_PATH:-documents}:/data/documents
      - ${CONSUME_PATH:-./consume}:/data/consume
      - storage_state:/data/storage-state
      - scanner_state:/data/scanner:ro
      - type: bind
        source: ${NAS_MOUNT_PATH:-/srv/dms-system/nas}
        target: /data/nas
        bind:
          propagation: rslave
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=1G,mode=1777
  storage:
    build: .
    # Mount capability belongs only to this helper, never the DMS or scanner.
    user: "0:0"
    entrypoint: ["/usr/bin/tini", "--", "python", "-m", "uvicorn", "storage_service.server:app", "--host", "0.0.0.0", "--port", "8002", "--no-access-log"]
    restart: unless-stopped
    environment:
      STORAGE_SERVICE_TOKEN: ${STORAGE_SERVICE_TOKEN:?Generate STORAGE_SERVICE_TOKEN in .env first}
      STORAGE_SERVICE_URL: http://storage:8002
    volumes:
      - ${DOCUMENTS_PATH:-documents}:/data/documents
      - ${CONSUME_PATH:-./consume}:/data/consume
      - storage_state:/data/storage-state
      - type: bind
        source: ${NAS_MOUNT_PATH:-/srv/dms-system/nas}
        target: /data/nas
        bind:
          propagation: rshared
    networks: [default]
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN, DAC_OVERRIDE, CHOWN, SETUID, SETGID, FOWNER, NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true, apparmor:unconfined]
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
      - /run:size=16M,mode=755
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
  scanner:
    build: .
    entrypoint: ["/usr/bin/tini", "--", "python", "-m", "app.scanner_service"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SECRET_KEY: ${SECRET_KEY:?Generate SECRET_KEY in .env first}
      STORAGE_SERVICE_URL: http://storage:8002
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-50}
      SCANNER_PUBLIC_HOST: ${SCANNER_PUBLIC_HOST:-}
      FTP_PASV_ADDRESS: ${FTP_PASV_ADDRESS:-}
      FTP_PASSIVE_MIN: ${FTP_PASSIVE_MIN:-30000}
      FTP_PASSIVE_MAX: ${FTP_PASSIVE_MAX:-30009}
    ports:
      - "${SCANNER_BIND:-0.0.0.0}:${SFTP_PORT:-2222}:2222"
      # Optional FTP accounts remain disabled until a tenant owner selects FTP.
      # Firewall these LAN-only ports if FTP is not needed.
      - "${SCANNER_BIND:-0.0.0.0}:${FTP_PORT:-2121}:2121"
      - "${SCANNER_BIND:-0.0.0.0}:${FTP_PASSIVE_MIN:-30000}-${FTP_PASSIVE_MAX:-30009}:${FTP_PASSIVE_MIN:-30000}-${FTP_PASSIVE_MAX:-30009}"
    volumes:
      - ${CONSUME_PATH:-./consume}:/data/consume
      - storage_state:/data/storage-state
      - scanner_state:/data/scanner
      - type: bind
        source: ${NAS_MOUNT_PATH:-/srv/dms-system/nas}
        target: /data/nas
        bind:
          propagation: rslave
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=64M,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time;from pathlib import Path;assert time.time()-json.loads(Path('/data/scanner/status.json').read_text())['heartbeat']<45"]
      interval: 15s
      timeout: 5s
      retries: 4
  codex:
    build:
      context: .
      dockerfile: codex_service/Dockerfile
    restart: unless-stopped
    environment:
      CODEX_SERVICE_TOKEN: ${CODEX_SERVICE_TOKEN:-}
      CODEX_STATE_ROOT: /data/codex
    volumes:
      - codex_auth:/data/codex
    networks: [codex_private]
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=256M,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
networks:
  codex_private:
volumes:
  documents:
  codex_auth:
  storage_state:
  scanner_state:
