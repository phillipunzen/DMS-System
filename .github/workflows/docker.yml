name: Test and publish Docker images
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: dms_test
          MARIADB_USER: dms
          MARIADB_PASSWORD: ci-test-password
          MARIADB_ROOT_PASSWORD: ci-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Validate deployment configurations
        run: |
          python3 scripts/init_env.py
          docker compose -f compose.yaml -f compose.dev.yaml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.db.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.host.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.db.yml -f docker-compose.host.yml -f docker-compose.host-db.yml config --quiet
      - name: Build application for tests
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: dms-system:test
          cache-from: type=gha,scope=dms-app
          cache-to: type=gha,mode=max,scope=dms-app
      - name: SQLite functional tests
        run: >-
          docker run --rm --entrypoint python
          -v "$GITHUB_WORKSPACE:/app:ro"
          dms-system:test -m pytest tests -q -p no:cacheprovider
      - name: MariaDB functional tests
        run: >-
          docker run --rm --network host --entrypoint python
          -e TEST_MARIADB=true
          -e 'DATABASE_URL=mysql+pymysql://dms:ci-test-password@127.0.0.1:3306/dms?charset=utf8mb4'
          -v "$GITHUB_WORKSPACE:/app:ro"
          dms-system:test -m pytest tests -q -p no:cacheprovider
  publish:
    needs: test
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: ''
            dockerfile: Dockerfile
            cache: dms-app
          - suffix: '-codex'
            dockerfile: codex_service/Dockerfile
            cache: dms-codex
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase image name
        id: image
        env:
          SUFFIX: ${{ matrix.suffix }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}${SUFFIX}" >> "$GITHUB_OUTPUT"
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Build and publish image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}
          provenance: mode=min
          sbom: true
